<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow circles -->
  <circle cx="200" cy="150" r="300" fill="#6366f1" fill-opacity="0.08" filter="url(#blur)"/>
  <circle cx="1000" cy="480" r="280" fill="#8b5cf6" fill-opacity="0.08" filter="url(#blur)"/>

  <!-- Grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Border card -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Ball icon -->
  <text x="130" y="260" font-size="110" font-family="Arial,sans-serif">⚽</text>

  <!-- FANTASY ARENA title -->
  <text x="280" y="220" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="88" fill="white" letter-spacing="-2">FANTASY</text>
  <text x="280" y="320" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="88" fill="url(#accent)" letter-spacing="-2">ARENA</text>

  <!-- Subtitle -->
  <text x="280" y="380" font-family="Arial,sans-serif" font-weight="400" font-size="32" fill="#a0aec0" letter-spacing="2">FANTASY FOOTBALL · MONDIALI 2026</text>

  <!-- Divider -->
  <rect x="280" y="410" width="120" height="3" fill="url(#accent)" rx="2"/>

  <!-- Description -->
  <text x="280" y="460" font-family="Arial,sans-serif" font-size="26" fill="#718096">Costruisci la rosa · Scegli il Capitano · Sfida i tuoi amici</text>

  <!-- URL badge -->
  <rect x="280" y="490" width="220" height="44" rx="22" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="390" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#818cf8">fantaarena.it</text>

  <!-- Trophy decoration -->
  <text x="980" y="380" text-anchor="middle" font-size="160" font-family="Arial,sans-serif" fill-opacity="0.12">🏆</text>

  <!-- Stars -->
  <text x="100" y="540" font-size="18" fill="#fbbf24" fill-opacity="0.6">★ ★ ★</text>
  <text x="980" y="120" font-size="16" fill="#6366f1" fill-opacity="0.5">★</text>
  <text x="1050" y="160" font-size="12" fill="#8b5cf6" fill-opacity="0.4">★</text>
</svg>
